name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. It has no secrets and needs none: every step runs in demo
# mode with AI off.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests, build, bundle check, end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Row level security tests
        run: npm run test:rls

      - name: Build
        run: npm run build

      - name: Check the client bundle for secrets and server code
        run: npm run check:bundle

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e
        env:
          # Serve the build made above instead of building again.
          E2E_SKIP_BUILD: "1"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
